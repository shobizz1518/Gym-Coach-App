services:
  - type: web
    name: gym-coach
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gym-coach-db
          property: connectionString
      - key: GROUP_CODE
        sync: false
databases:
  - name: gym-coach-db
    plan: free
