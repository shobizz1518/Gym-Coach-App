<style>

<script>
// ===== Exercise library + animated demo engine =====
const D2R = Math.PI / 180;
const vec = (a, L) => [L * Math.sin(a * D2R), -L * Math.cos(a * D2R)];
const add = (p, v) => [p[0] + v[0], p[1] + v[1]];
// segment lengths: an elongated, athletic figure about 8 heads tall
const LEN = { torso: 50, ua: 31, fa: 27, th: 44, sh: 43 };
const FLOOR = 186;

function ik(base, target, L1, L2, dir) {
  const dx = target[0] - base[0], dy = target[1] - base[1];
  let d = Math.hypot(dx, dy);
  d = Math.min(Math.max(d, Math.abs(L1 - L2) + 0.5), L1 + L2 - 0.3);
  const ang = Math.atan2(dy, dx);
  const c = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
  const a = ang + dir * Math.acos(Math.max(-1, Math.min(1, c)));
  return [base[0] + L1 * Math.cos(a), base[1] + L1 * Math.sin(a)];
}

function lerpObj(a, b, t) {
  if (typeof a === 'number') return a + (b - a) * t;
  if (Array.isArray(a)) return a.map((v, i) => lerpObj(v, b[i], t));
  if (a && typeof a === 'object') { const o = {}; for (const k in a) o[k] = (k in b) ? lerpObj(a[k], b[k], t) : a[k]; return o; }
  return a;
}

function sideJoints(P) {
  const J = {};
  J.hip = P.hip;
  J.shoulder = add(J.hip, vec(P.torso, LEN.torso));
  J.head = add(J.shoulder, vec(P.torso + (P.neck || 0), 15.5));
  if (P.handRel || P.hand) {
    const tgt = P.hand || add(J.shoulder, P.handRel);
    J.elbow = ik(J.shoulder, tgt, LEN.ua, LEN.fa, P.elbowDir || 1);
    J.hand = add(J.elbow, (() => { const dx = tgt[0] - J.elbow[0], dy = tgt[1] - J.elbow[1]; const m = Math.hypot(dx, dy) || 1; return [dx / m * LEN.fa, dy / m * LEN.fa]; })());
  } else {
    J.elbow = add(J.shoulder, vec(P.ua, LEN.ua));
    J.hand = add(J.elbow, vec(P.fa, LEN.fa));
  }
  if (P.ankle) {
    J.knee = ik(J.hip, P.ankle, LEN.th, LEN.sh, P.kneeDir || -1);
    const dx = P.ankle[0] - J.knee[0], dy = P.ankle[1] - J.knee[1], m = Math.hypot(dx, dy) || 1;
    J.ankle = [J.knee[0] + dx / m * LEN.sh, J.knee[1] + dy / m * LEN.sh];
  } else {
    J.knee = add(J.hip, vec(P.th, LEN.th));
    J.ankle = add(J.knee, vec(P.sh, LEN.sh));
    // longer shins must not sink through the floor: bend the knee so the foot rests on it
    if (J.ankle[1] > FLOOR - 2 && !P._nc) {
      const tgt = [J.ankle[0], FLOOR - 2], kd = (J.knee[0] - J.hip[0]) * (J.ankle[0] - J.knee[0]) >= 0 ? -1 : 1;
      if (Math.hypot(...sub(tgt, J.hip)) < LEN.th + LEN.sh - 0.5) { J.knee = ik(J.hip, tgt, LEN.th, LEN.sh, P.kneeDir || -1); J.ankle = tgt; }
    }
  }
  J.toe = P.toe || add(J.ankle, vec(P.ft == null ? 95 : P.ft, 12));
  if (P.ankle2) {
    J.knee2 = ik(J.hip, P.ankle2, LEN.th, LEN.sh, P.kneeDir2 || -1);
    const dx = P.ankle2[0] - J.knee2[0], dy = P.ankle2[1] - J.knee2[1], m = Math.hypot(dx, dy) || 1;
    J.ankle2 = [J.knee2[0] + dx / m * LEN.sh, J.knee2[1] + dy / m * LEN.sh];
    J.toe2 = P.toe2 || add(J.ankle2, vec(P.ft2 == null ? 95 : P.ft2, 12));
  }
  return J;
}

function frontJoints(P) {
  const J = {}, cx = 100, hy = P.hipY, sy = hy - 48;
  const hw = FEM ? 11 : 9, sw = FEM ? 14.5 : 17.5;
  J.hipR = [cx + hw, hy]; J.hipL = [cx - hw, hy];
  J.shR = [cx + sw, sy]; J.shL = [cx - sw, sy];
  J.head = [cx, sy - 16.5]; J.neck = [cx, sy - 4];
  const m = v => [-v[0], v[1]];
  const ue = vec(P.ua, LEN.ua * (P.us == null ? 1 : P.us)), fe = vec(P.fa, LEN.fa * (P.fs == null ? 1 : P.fs));
  J.elbowR = add(J.shR, ue); J.handR = add(J.elbowR, fe);
  J.elbowL = add(J.shL, m(ue)); J.handL = add(J.elbowL, m(fe));
  const te = vec(P.th, LEN.th * (P.ts == null ? 1 : P.ts)), se = vec(P.sh, LEN.sh * (P.ss == null ? 1 : P.ss));
  J.kneeR = add(J.hipR, te); J.ankleR = add(J.kneeR, se);
  J.kneeL = add(J.hipL, m(te)); J.ankleL = add(J.kneeL, m(se));
  J.barMid = [(J.handR[0] + J.handL[0]) / 2, (J.handR[1] + J.handL[1]) / 2];
  if (P.yaw) yawJoints(J, P);
  return J;
}
// 45° style view: a shortened limb is pointing toward the camera, so give it depth, then turn the body
function yawJoints(J, P) {
  const dz = (s, L) => s == null || s >= 1 ? 0 : Math.sqrt(Math.max(0, 1 - s * s)) * L;
  const zU = dz(P.us, LEN.ua), zF = dz(P.fs, LEN.fa), zT = dz(P.ts, LEN.th), zS = dz(P.ss, LEN.sh);
  const Z = { elbowR: zU, elbowL: zU, handR: zU + zF, handL: zU + zF, kneeR: zT, kneeL: zT, ankleR: zT + zS, ankleL: zT + zS };
  const a = P.yaw * D2R, c = Math.cos(a), s = Math.sin(a);
  for (const k of ['hipR', 'hipL', 'shR', 'shL', 'elbowR', 'elbowL', 'handR', 'handL', 'kneeR', 'kneeL', 'ankleR', 'ankleL']) {
    const x = J[k][0] - 100, z = Z[k] || 0;
    J[k] = [100 + x * c + z * s, J[k][1] + z * 0.3];
  }
  J.barMid = [(J.handR[0] + J.handL[0]) / 2, (J.handR[1] + J.handL[1]) / 2];
  J.far = 'R';
}

// ---- Renderer v2: shaped body, muscle highlights, motion path, detailed machines ----
const C = { body: 'url(#gBody)', far: '#6f6699', mach: '#2c2946', machL: '#4a4570', machHi: '#6d66a3', accent: '#a855f7', move: '#8b5cf6', pad: '#3a3363', cable: '#a5b4fc', path: '#60a5fa', mus: '#ff4fa3' };
const f1 = n => n.toFixed(1);
const P2 = p => `${f1(p[0])},${f1(p[1])}`;
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];

function calcTargets(p) {
  const kg = p.weightLb * 0.4536, cm = (p.heightFt * 12 + p.heightIn) * 2.54, bf = num(p.bodyFat);
  const useLean = bf >= 5 && bf <= 60;
  const lbmKg = useLean ? kg * (1 - bf / 100) : null;
  const bmr = useLean ? 370 + 21.6 * lbmKg : 10 * kg + 6.25 * cm - 5 * p.age + (p.sex === 'f' ? -161 : 5);
  const tdee = bmr * p.activity;
  const floor = p.sex === 'f' ? 1200 : 1500;
  const kcal = Math.max(floor, Math.round((tdee + (GOALS[p.goal] || GOALS.maintain)[0]) / 50) * 50);
  const protein = Math.round((useLean ? lbmKg * 2.2 * 1.0 : p.weightLb * 0.82) / 5) * 5;
  const fat = Math.round(kcal * 0.27 / 9 / 5) * 5;
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4 / 5) * 5);
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal, p: protein, c: carbs, f: fat, lean: useLean, formula: useLean ? 'Katch-McArdle (uses body fat %)' : 'Mifflin-St Jeor' };
}

// ---------- Weekly goal + streak (counts days with a workout or 20+ min of cardio, Monday to Sunday) ----------
function weekMon(d = new Date()) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function activeDays(st) {
  const s = new Set();
  for (const w of Object.values(st.sessions || {})) if (w && w.start && Array.isArray(w.ex) && w.ex.length) s.add(dateKey(new Date(w.start)));
  for (const c of cardioList(st)) if (+c.min >= 20 && c.d) s.add(c.d);
  return s;
}
function weekCount(days, mon) { let n = 0; for (let i = 0; i < 7; i++) { const d = new Date(mon); d.setDate(d.getDate() + i); if (days.has(dateKey(d))) n++; } return n; }
function streakOf(st) {
  const goal = Math.max(1, Math.min(7, +(st.settings || {}).weekGoal || 4)), days = activeDays(st), mon = weekMon();
  const cur = weekCount(days, mon); let n = cur >= goal ? 1 : 0;
  for (let i = 1; i < 520; i++) { const m = new Date(mon); m.setDate(m.getDate() - 7 * i); if (weekCount(days, m) >= goal) n++; else break; }
  return { goal, cur, streak: n, days, mon };
}
function goalWeekCard() {
  const g = streakOf(S), td = dateKey();
  const dots = WEEKDAYS.map((w, i) => { const d = new Date(g.mon); d.setDate(d.getDate() + i); const k = dateKey(d); return `<span class="wgdot ${g.days.has(k) ? 'on' : ''} ${k === td ? 'today' : ''}">${w[0]}</span>`; }).join('');
  const left = g.goal - g.cur;
  return `<div class="card wgcard"><div class="phead"><h3>This week</h3><span class="wgstreak">${g.streak ? `🔥 ${g.streak} week${g.streak === 1 ? '' : 's'} streak` : '<span class="muted small">Hit your goal to start a streak</span>'}</span></div>
    <div class="wgrow"><div class="wgdots">${dots}</div><div class="wgnum"><b>${g.cur}</b>/<span>${g.goal}</span></div></div>
    <div class="wgfoot"><small class="muted">${left > 0 ? `${left} more active day${left === 1 ? '' : 's'} to hit your goal` : 'Goal hit this week. Nice!'} · workouts or 20+ min cardio</small>
    <span class="wgset"><button class="lenbtn sm" data-act="wgoal" data-d="-1" aria-label="Lower goal">−</button><small>goal ${g.goal}/wk</small><button class="lenbtn sm" data-act="wgoal" data-d="1" aria-label="Raise goal">+</button></span></div></div>`;
}

// ---------- Personal records ----------
function setE1(z) { return +z.r === 1 ? +z.w || 0 : e1rm(+z.w || 0, Math.min(+z.r || 0, 12)); }
// best before this set: saved workouts, logged maxes, and earlier sets in this workout
function prBefore(id, a, e) {
  const b = exBest(S, id); let best = b ? b.v : 0, topW = 0;
  for (const s of Object.values(S.sessions || {})) for (const x of (s.ex || [])) if (x.id === id) for (const z of (x.sets || [])) topW = Math.max(topW, +z.w || 0);
  for (const x of a.ex) if (x.id === id) for (const z of x.sets) if (z !== e.sets[e.sets.length - 1]) { best = Math.max(best, Math.round(setE1(z))); topW = Math.max(topW, +z.w || 0); }
  return { best, topW, any: !!b || a.ex.some(x => x.id === id && x.sets.length > 1) };
}
function checkPR(a, e) {
  const z = e.sets[e.sets.length - 1]; if (!z || !(+z.w > 0)) return;
  const pb = prBefore(e.id, a, e); if (!pb.any) return;
  const v = Math.round(setE1(z)), name = (EXERCISES[e.id] || { name: e.id }).name;
  let msg = null;
  if (v > pb.best) { z.pr = 1; msg = `🏆 New PR on ${name}! Est. 1RM ${v} lb (was ${pb.best})`; }
  else if (+z.w > pb.topW) { z.pr = 1; msg = `🏆 Heaviest ${name} yet: ${z.w} lb`; }
  if (!msg) return;
  const L = exLeaders(e.id), top = L[0];
  if (GROUP.on && L.length > 1 && v > (top.p.id === curPid() ? (L[1] ? L[1].b.v : 0) : top.b.v)) msg += ' · best in the group!';
  a.prs = (a.prs || 0) + 1;
  setTimeout(() => { toast(msg); beep(660, 0.12); beep(880, 0.12, 0.14); beep(1175, 0.2, 0.28); buzz([40, 60, 40, 60, 120]); }, 60);
}

// body weight trend: 7-day average and rate per week (only shown to you, behind your PIN)
function weightTrend(wi) {
  const ks = Object.keys(wi).filter(k => +wi[k] > 0).sort(); if (ks.length < 2) return '';

function lineChart(points, opts = {}) {
  if (points.length < 2) return `<div class="empty">${points.length ? 'Log one more to see a trend.' : 'No data yet.'}</div>`;
  const W = 320, H = 140, P = 26;
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); if (y1 - y0 < 1) { y0 -= 1; y1 += 1; } const padY = (y1 - y0) * 0.15; y0 -= padY; y1 += padY;
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = x => P + (x - x0) / (x1 - x0 || 1) * (W - P - 8), Y = y => H - 18 - (y - y0) / (y1 - y0) * (H - 30);
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const ticks = [y0 + padY, (y0 + y1) / 2, y1 - padY].map(v => `<text x="2" y="${Y(v) + 3}" class="ax">${Math.round(v)}</text><line x1="${P}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/>`).join('');
  const lastP = points[points.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${ticks}<path d="${d}" class="ln"/>${points.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" class="pt"/>`).join('')}
    <text x="${P}" y="${H - 3}" class="ax">${fmtDate(x0, { month: 'short', day: 'numeric' })}</text><text x="${W - 4}" y="${H - 3}" class="ax" text-anchor="end">${fmtDate(x1, { month: 'short', day: 'numeric' })}</text>
    <text x="${X(lastP.x) - 4}" y="${Y(lastP.y) - 8}" class="lbl" text-anchor="end">${opts.fmt ? opts.fmt(lastP.y) : lastP.y}</text></svg>`;
}

const SUG = {
  p: [['Chicken breast, cooked', 'oz', 1, 10], ['Greek yogurt, nonfat plain', 'cup', 0.5, 2], ['Whey protein powder', 'scoop', 0.5, 2], ['Tuna, canned in water', 'can', 0.5, 1], ['Egg whites', 'cup', 0.25, 1.5], ['Shrimp, cooked', 'oz', 1, 10], ['Cottage cheese, 2%', 'cup', 0.5, 1.5], ['Salmon, cooked', 'oz', 1, 8], ['Ground turkey 93% lean, cooked', 'oz', 1, 8], ['Turkey breast, deli', 'slice', 1, 8]],
  c: [['White rice, cooked', 'cup', 0.25, 2], ['Oats, dry', 'cup', 0.25, 1], ['Sweet potato, baked', 'potato', 0.5, 2], ['Banana', 'banana', 0.5, 2], ['Pasta, cooked', 'cup', 0.25, 2], ['Potato, baked', 'potato', 0.5, 2], ['Blueberries', 'cup', 0.5, 2], ['Whole wheat bread', 'slice', 1, 3]],
  f: [['Almonds', 'oz', 0.5, 1.5], ['Peanut butter', 'tbsp', 0.5, 2], ['Avocado', 'avocado', 0.25, 1], ['Olive oil', 'tbsp', 0.5, 1.5], ['Cheddar cheese', 'slice', 1, 2]],
};
const foodByName = n => FOODS.find(f => f.name === n);
function portion(name, unit, step, max, nut, need) {
  const f = foodByName(name); if (!f) return null;
  const g1 = unitGrams(f, unit); const per = f[nut] * g1 / 100; if (per <= 0) return null;
  let amt = Math.round(need / per / step) * step; amt = Math.min(max, Math.max(step, amt));
  const m = foodMacros(f, amt, unit);
  const base = name.split(',')[0].toLowerCase();
  const unitLbl = amt > 1 && !['oz', 'g', 'tbsp', 'tsp'].includes(unit) ? unit + 's' : unit;
  const label = base.endsWith(unit) ? `${fmtAmt(amt)} ${amt > 1 ? base + 's' : base}` : `${fmtAmt(amt)} ${unitLbl} ${base}`;
  return { name, unit, amt, ...m, kcal: kcalOf(m.p, m.c, m.f), label };
}
const fmtAmt = x => { const w = Math.floor(x), fr = x - w; const F = { 0.25: '¼', 0.5: '½', 0.75: '¾' }[Math.round(fr * 4) / 4]; return (w ? w : '') + (F || '') || '0'; };
function foodPlan(left) {
  const seed = new Date().getDate();
  let rem = { ...left }; const plan = [];
  const pick = (nut, cap) => {
    if (rem[nut] < (nut === 'f' ? 8 : nut === 'p' ? 12 : 20)) return;
    const need = Math.min(rem[nut], cap);
    const opts = SUG[nut].filter(([n]) => !plan.find(x => x.name === n)).map(([n, u, s, mx]) => portion(n, u, s, mx, nut, need)).filter(Boolean)
      .filter(o => o.kcal <= rem.kcal + 60 && (nut === 'p' || o.p <= rem.p + 15) && (nut === 'f' || o.f <= rem.f + 5));
    if (!opts.length) return;
    const o = opts[seed % Math.min(2, opts.length)];
    plan.push(o); rem = { p: rem.p - o.p, c: rem.c - o.c, f: rem.f - o.f, kcal: rem.kcal - o.kcal };
  };
  pick('p', 55); pick('c', 75); pick('f', 22); pick('p', 45);
  const alts = rem && left.p >= 15 ? SUG.p.map(([n, u, s, mx]) => portion(n, u, s, mx, 'p', Math.min(left.p, 40))).filter(o => o && !plan.find(x => x.name === o.name) && o.kcal <= left.kcal + 60).slice(0, 4) : [];
  return { plan, alts };
}
function viewLeft(t, tot) {

  const tile = (lbl, v, unit, cls) => `<div class="ltile ${cls} ${v < 0 ? 'over' : ''}"><b>${Math.abs(Math.round(v))}${unit}</b><small>${lbl} ${v < 0 ? 'over' : 'left'}</small></div>`;
  let h = `<div class="card"><div class="phead"><h3>Left for today</h3></div><div class="ltiles">${tile('cal', left.kcal, '', 'k')}${tile('protein', left.p, 'g', 'p')}${tile('carbs', left.c, 'g', 'c')}${tile('fat', left.f, 'g', 'f')}</div>`;
  const pos = { p: Math.max(0, left.p), c: Math.max(0, left.c), f: Math.max(0, left.f), kcal: Math.max(0, left.kcal) };
  const { plan, alts } = foodPlan(pos);
  UI.plan = plan.concat(alts);
  if (pos.kcal < 120 || (!plan.length && !alts.length)) h += `<p class="small muted">${left.kcal < -100 ? 'You’re over for today. Lean protein and veggies are the best picks if you’re still hungry.' : 'You’re about at your targets for today. Nice.'}</p>`;
  else {
    const row = (o, i) => `<div class="sugrow"><div><b>${esc(o.label)}</b><small class="muted">${Math.round(o.p)}P · ${Math.round(o.c)}C · ${Math.round(o.f)}F · ${o.kcal} kcal</small></div><button class="btn small primary" data-act="sug-add" data-i="${i}">+ Log</button></div>`;
    if (plan.length) {
      const sum = plan.reduce((s, o) => ({ p: s.p + o.p, c: s.c + o.c, f: s.f + o.f, k: s.k + o.kcal }), { p: 0, c: 0, f: 0, k: 0 });

function exercisesFor(parts) {

// ---------- Tick (timers) ----------
function tick() {
  const a = S.active, now = Date.now();
  if (a) {
    const end = a.end || now;
    document.querySelectorAll('[data-tick="elapsed"]').forEach(el => el.textContent = fmtClock((end - a.start) / 1000));
    if (a.restEnd) {
      const left = (a.restEnd - now) / 1000;
      const el = document.querySelector('[data-tick="rest"]'); if (el) el.textContent = fmtClock(Math.ceil(left));
      const ring = document.querySelector('[data-tick="ring"]'); if (ring) ring.setAttribute('stroke-dashoffset', (326.7 * (1 - Math.max(0, left) / Math.max(1, a.restTotal))).toFixed(1));
      if (left <= 3.2 && left > 0 && !a['cd' + Math.ceil(left)]) { a['cd' + Math.ceil(left)] = true; beep(660, 0.08); }
      if (left <= 0) {
        a.restEnd = null; delete a.cd1; delete a.cd2; delete a.cd3; delete a.cd4;
        beep(988, 0.18); beep(988, 0.18, 0.25); beep(1318, 0.35, 0.5); buzz([200, 100, 200, 100, 300]);
        const e = curEx(); toast(`Go! ${EXERCISES[e.id] ? EXERCISES[e.id].name : ''}, set ${Math.min(e.sets.length + 1, e.target.sets)}`);
        a.lastTs = now; touch('active'); render(); return;
      }
    }
    const nudge = $('#nudge');
    if (nudge) {
      const e = curEx(); const idle = (now - a.lastTs) / 1000; const limit = (e ? e.target.rest : 90) + 120;
      if (!a.restEnd && idle > limit) { nudge.hidden = false; nudge.textContent = `⏱ ${Math.floor(idle / 60)} min since your last set. Ready for the next one?`; } else nudge.hidden = true;
    }
  }
}

    case 'del-prof': if (UI.confirm !== 'delprof:' + b.dataset.id) { UI.confirm = 'delprof:' + b.dataset.id; render(); } else { UI.confirm = null; deleteProfile(b.dataset.id); toast('Person deleted'); } break;
    case 'view': UI.view = b.dataset.v; render(); break;
    case 'hv': UI.hv = b.dataset.v; render(); break;
    case 'dpause': DEMO.paused = !DEMO.paused; b.textContent = DEMO.paused ? '\u25b6 Play' : '\u23f8 Pause'; break;
    case 'dspeed': DEMO.speed = DEMO.speed < 1 ? 1 : 0.45; b.classList.toggle('on', DEMO.speed < 1); break;
    case 'lib-part': { const L = UI.lib, p = b.dataset.p; L.parts = L.parts.includes(p) ? L.parts.filter(x => x !== p) : [...L.parts, p]; render(); break; }
    case 'lib-eq': { const L = UI.lib, e = b.dataset.e; L.eq = L.eq.includes(e) ? L.eq.filter(x => x !== e) : [...L.eq, e]; render(); break; }
    case 'lib-clear': UI.lib = { parts: [], eq: [], q: '' }; render(); break;
    case 'add-cur': { const id = b.dataset.id, d = defaultsFor(id); S.active.ex.push({ id, target: { sets: d.sets, lo: d.lo, hi: d.hi, rest: d.rest }, sets: [] }); S.active.i = S.active.ex.length - 1; touch('active'); UI.sheet = null; UI.tab = 'train'; render(); toast('Added to your workout'); break; }
    case 'add-day': { const di = +$('#add-day').value, d = routine()[di]; d.ex.push(defaultsFor(b.dataset.id)); touch('settings'); toast(`Added to Day ${di + 1} · ${d.name}`); break; }
    case 'add-quick': { const id = b.dataset.id; startWorkout(null, { key: 'custom', name: EXERCISES[id].name, parts: PARTS[id] || [], ex: [defaultsFor(id)] }); UI.tab = 'train'; render(); break; }
    case 'sug-add': { const o = UI.plan[+b.dataset.i]; if (o) { addEntry({ name: o.label, p: Math.round(o.p * 10) / 10, c: Math.round(o.c * 10) / 10, f: Math.round(o.f * 10) / 10, q: 1 }); render(); toast('Logged ' + o.label); } break; }
    case 'sug-all': { const n = UI.plan.length; const plan = foodPlan({ p: 0, c: 0, f: 0, kcal: 0 }); const t2 = targets(), tot2 = dayTotals(UI.macroDate); const pl = foodPlan({ p: Math.max(0, t2.p - tot2.p), c: Math.max(0, t2.c - tot2.c), f: Math.max(0, t2.f - tot2.f), kcal: Math.max(0, t2.kcal - tot2.kcal) }).plan; pl.forEach(o => addEntry({ name: o.label, p: Math.round(o.p * 10) / 10, c: Math.round(o.c * 10) / 10, f: Math.round(o.f * 10) / 10, q: 1 })); render(); toast(`Logged ${pl.length} foods`); break; }
    case 'fmode': UI.fmode = b.dataset.m; render(); break;
    case 'lk-pick': { FL.sel = +b.dataset.i; FL.ai = null; const p = parseFoodText($('#lk-q').value); $('#lk-q').value = FOODS[FL.sel].name; lkRefresh(false); const f = FOODS[FL.sel]; const u = p.unit && unitGrams(f, p.unit) ? p.unit : foodUnits(f)[0]; $('#lk-unit').value = u; lkPreview(); $('#lk-amt').focus(); break; }
    case 'lk-ai': lkAskClaude(); break;
    case 'lk-add': lkAdd(); break;
    case 'edit-foods': UI.editFoods = !UI.editFoods; render(); break;
    case 'del-food': S.settings.foods.splice(+b.dataset.i, 1); touch('settings'); render(); break;
    case 'del-entry': { const k = UI.macroDate; S.macros[k].entries = S.macros[k].entries.filter(x => x.id !== b.dataset.id); touch('m_' + k); render(); break; }
    case 'copy-prev': { const k = UI.macroDate, pk = shiftKey(k, -1); S.macros[k] = { entries: S.macros[pk].entries.map(e => ({ ...e, id: uid(), t: Date.now() })) }; touch('m_' + k); render(); break; }
    case 'apply-calc': { const c = calcTargets(S.settings.profile); S.settings.targets = { p: c.p, c: c.c, f: c.f }; S.settings.autoT = true; touch('settings'); toast('Targets updated'); render(); break; }
    case 'routine-open': UI.routineOpen = UI.routineOpen === +b.dataset.i ? null : +b.dataset.i; render(); break;
    case 'rt-up': { const ex = edSplit().days[+b.dataset.di].ex, i = +b.dataset.ei; [ex[i - 1], ex[i]] = [ex[i], ex[i - 1]]; touch('settings'); render(); break; }
    case 'rt-del': edSplit().days[+b.dataset.di].ex.splice(+b.dataset.ei, 1); touch('settings'); render(); break;
    case 'rt-add': edSplit().days[+b.dataset.di].ex.push(suggestFirst(edSplit().days[+b.dataset.di])); touch('settings'); render(); break;
    case 'reset-routine': { const d = splitById('default'); if (d) d.days = clone(DEFAULT_ROUTINE); else S.settings.splits.unshift(defaultSplit()); touch('settings'); UI.confirm = null; toast('Default split reset'); render(); break; }
    case 'backup': { const txt = JSON.stringify({ app: 'gym', v: 1, settings: S.settings, sessions: S.sessions, macros: S.macros, cardio: S.cardio }); try { navigator.clipboard.writeText(txt).then(() => toast('Backup copied. Paste it somewhere safe, like a note.'), () => showBackup(txt)); } catch (e) { showBackup(txt); } break; }
    case 'restore': {
      try { const d = JSON.parse($('#restore').value); if (!d.settings) throw 0; S.settings = Object.assign(defaultState().settings, d.settings); S.sessions = d.sessions || {}; S.macros = d.macros || {}; S.cardio = d.cardio || {}; Object.keys(S.cardio).forEach(k => touch('k_' + k)); touch('settings'); Object.keys(S.sessions).forEach(k => touch('w_' + k)); Object.keys(S.macros).forEach(k => touch('m_' + k)); toast('Data restored'); }
      catch (e) { toast('That doesn’t look like a backup from this app'); }
      UI.confirm = null; render(); break;
    }
    case 'toast-action': { const el = $('#toast'); if (el._action) el._action(); el.classList.remove('show'); break; }
  }
});
function showBackup(txt) { UI.sheet = null; $('#sheet').innerHTML = `<div class="panel"><div class="phead"><h3>Your backup</h3><button class="x" data-act="close">✕</button></div><p class="small">Select all and copy this text.</p><textarea rows="8" readonly>${esc(txt)}</textarea></div>`; $('#sheet').classList.add('open'); }

document.addEventListener('submit', ev => {
  if (ev.target.id !== 'foodform') return; ev.preventDefault();
  const name = $('#f-name').value.trim(); if (!name) return;
  const f = { name, p: num($('#f-p').value), c: num($('#f-c').value), f: num($('#f-f').value) };
  const q = num($('#f-q').value) || 1;
  if (!f.p && !f.c && !f.f) { toast('Enter at least one macro'); return; }
  addEntry({ ...f, q });
  const foods = S.settings.foods.filter(x => x.name.toLowerCase() !== name.toLowerCase());
  foods.unshift(f); S.settings.foods = foods.slice(0, 30); touch('settings');
  render(); toast(`Added ${name}`);
});
let SWIPE = null;
document.addEventListener('pointerdown', ev => { const el = ev.target.closest && ev.target.closest('[data-swipe]'); SWIPE = el ? { x: ev.clientX, kind: el.dataset.swipe } : null; });
document.addEventListener('pointerup', ev => {
  if (!SWIPE) return; const dx = ev.clientX - SWIPE.x, kind = SWIPE.kind; SWIPE = null;
  if (Math.abs(dx) < 40) return;
  { UI.hv = (UI.hv || 'front') === 'front' ? 'back' : 'front'; render(); }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'lib-q') { UI.lib.q = el.value; $('#lib-list').innerHTML = libList(); }
  if (el.id === 'lk-q') lkRefresh(true);
  if (el.id === 'ax-q') { UI.ax.q = el.value; $('#ax-list').innerHTML = axList(); }
  if (el.id === 'lk-amt') lkPreview();
  if (el.dataset.cd && UI.cd) { UI.cd[el.dataset.cd] = el.value; const pv = $('#cd-prev'); if (pv) pv.innerHTML = cdPrevText(cardioKcal({ ...UI.cd, min: num(UI.cd.min), mi: num(UI.cd.mi), mph: num(UI.cd.mph), inc: UI.cd.inc === '' || UI.cd.inc == null ? undefined : num(UI.cd.inc) }, myLb())); }
  if (el.closest && el.closest('#foodform')) { const q = num($('#f-q').value) || 1; $('#f-kcal').textContent = kcalOf(num($('#f-p').value) * q, num($('#f-c').value) * q, num($('#f-f').value) * q) + ' kcal'; }
  if (el.dataset.pname != null && el.hasAttribute('data-pname')) { curProfile().name = el.value.slice(0, 30) || 'Me'; touchProfiles(); $('#pname') && ($('#pname').textContent = curProfile().name); }
  if (el.dataset.sp === 'name') { edSplit().name = el.value.slice(0, 60) || 'My split'; touch('settings'); }
  if (el.dataset.day) { const [di, f] = el.dataset.day.split('.'); const d = edSplit().days[+di]; if (f === 'name') { d.name = el.value.slice(0, 40); touch('settings'); } }
  if (el.dataset.tgt) { S.settings.targets[el.dataset.tgt] = Math.max(0, Math.round(num(el.value))); S.settings.autoT = false; touch('settings'); $('#tgt-kcal') && ($('#tgt-kcal').textContent = `= ${targets().kcal.toLocaleString()} kcal per day`); }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.prof) { const k = el.dataset.prof; S.settings.profile[k] = PROF_STR.includes(k) ? el.value : (k === 'bodyFat' && el.value === '' ? '' : num(el.value)); touch('settings'); if (['weightLb', 'heightFt', 'heightIn', 'age', 'sex', 'activity', 'goal', 'bodyFat'].includes(k)) recalcTargets('Profile updated.'); render(); }
  if (el.dataset.act === 'autot') { S.settings.autoT = el.checked; if (el.checked) recalcTargets('Auto-update turned on.', true); touch('settings'); render(); }
  if (el.dataset.day) { const [di, f] = el.dataset.day.split('.'); const d = edSplit().days[+di]; if (f === 'key') { if (el.value === 'rest') { d.key = 'rest'; } else { d.key = 'custom'; d.parts = d.parts || []; d.ex = d.ex || []; } touch('settings'); render(); } if (f === 'name') render(); }
  if (el.id === 'lk-unit') lkPreview();
  if (el.dataset.opt) { S.settings[el.dataset.opt] = el.checked; touch('settings'); }
  if (el.dataset.rt) { const [di, ei, f] = el.dataset.rt.split('.'); const e = edSplit().days[+di].ex[+ei]; e[f] = f === 'id' ? el.value : Math.max(f === 'rest' ? 0 : 1, Math.round(num(el.value))); if (e.lo > e.hi) e.hi = e.lo; touch('settings'); if (f === 'id') render(); }
  if (el.dataset.act === 'prog-ex') { UI.progEx = el.value; render(); }
  if (el.dataset.act === 'rk-ex') { UI.rk.l = el.value; render(); }
  if (el.dataset.act === 'wgoal-in') { const v = Math.round(num(el.value)); if (v >= 16 && v <= 300) { S.settings.waterGoal = v; touch('settings'); } render(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (S.active) keepAwake(true); tick(); } });

render();
requestAnimationFrame(animate);
setInterval(tick, 250);
window.addEventListener('error', ev => { try { toast('Error: ' + errText(ev.error || ev.message)); } catch (e) { } });
window.addEventListener('unhandledrejection', ev => { console.error(ev.reason); });
initSync();
getSample().then(() => { if ($('#lk-q')) lkRefresh(false); });

</script>
</body>
